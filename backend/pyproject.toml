[project]
name = "python-project-386"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "dj-database-url>=3.1.2",
    "django>=6.1,<6.2",
    "gunicorn>=26.2.0",
    "psycopg[binary]>=3.3.5",
    "python-dotenv>=1.2.3",
]

[dependency-groups]
dev = [
    "pytest-django>=4.14.0",
    "ruff>=0.16.7",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["."]
testpaths = ["core"]
python_files = ["tests.py", "test_*.py", "*_tests.py"]

[tool.ruff]
target-version = "py314"
src = ["."]
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
