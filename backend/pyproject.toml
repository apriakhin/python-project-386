[project]
name = "call-calendar"
version = "0.1.0"
description = ""
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<5.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.0",
    "requests>=2.0",
    "ruff>=0.12",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["."]
python_files = ["tests.py", "test_*.py", "*_test.py"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
